name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The release is created once, up front — letting the matrix jobs race to
  # create it produces duplicate drafts and already_exists failures.
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create release for tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"

  build:
    name: ${{ matrix.asset }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: bun-darwin-arm64
            asset: cronview-darwin-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: cronview-darwin-x64
          - runner: ubuntu-24.04
            target: bun-linux-x64
            asset: cronview-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: cronview-linux-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun scripts/build.ts ${{ matrix.target }} ./dist/${{ matrix.asset }}
      - name: Smoke test
        run: ./dist/${{ matrix.asset }} --version
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.asset }}
